<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LINKVISION SHOP</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif;
  min-height:100vh
}
header{
  position:sticky;top:0;z-index:20;
  background:rgba(5,5,5,.92);backdrop-filter:blur(15px);
  border-bottom:1px solid #191919
}
.nav{
  max-width:1250px;margin:auto;padding:20px 25px;
  display:flex;align-items:center;justify-content:space-between;gap:20px
}
.logo{font-size:22px;font-weight:900;letter-spacing:2px}
.logo span{color:#777}
.nav-links{display:flex;gap:25px;list-style:none}
.nav-links a{color:#aaa;text-decoration:none;font-size:13px;font-weight:700}
.nav-links a:hover{color:#fff}
.languages button{
  border:0;background:none;color:#777;cursor:pointer;
  font-weight:700;margin-left:8px
}
.languages button.active{color:#fff}

.hero{
  max-width:1250px;margin:auto;padding:100px 25px 65px
}
.hero small{color:#777;letter-spacing:4px;font-size:11px}
.hero h1{
  font-size:clamp(45px,8vw,90px);line-height:.9;
  margin:20px 0;font-weight:900;letter-spacing:-4px
}
.hero p{color:#777;max-width:520px;line-height:1.7}

.filters{
  max-width:1250px;margin:auto;padding:0 25px 35px;
  display:flex;gap:10px;flex-wrap:wrap
}
.filter{
  background:#0c0c0c;border:1px solid #222;color:#888;
  padding:10px 16px;border-radius:30px;cursor:pointer;
  font-size:11px;font-weight:800
}
.filter:hover,.filter.active{background:#fff;color:#000}

main{max-width:1250px;margin:auto;padding:0 25px 80px}

.category-title{
  margin:55px 0 25px;
  display:flex;
  align-items:center;
  gap:18px;
  color:#fff;
  font-size:22px;
  font-weight:900;
  letter-spacing:3px;
  text-transform:uppercase;
}

.category-title::after{
  content:"";
  height:1px;
  background:#333;
  flex:1;
}
.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px
}
.product{
  background:#0a0a0a;border:1px solid #171717;
  border-radius:14px;overflow:hidden;
  transition:.25s
}
.product:hover{transform:translateY(-5px);border-color:#333}

.image-box{
  height:300px;background:#0e0e0e;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden
}
.product-image{
  width:100%;height:100%;object-fit:cover
}
.image-fallback{
  color:#333;font-size:12px;letter-spacing:2px
}

.info{padding:17px}
.tag{
  color:#666;font-size:9px;font-weight:800;
  letter-spacing:2px;text-transform:uppercase
}
.name{
  font-size:15px;font-weight:800;
  margin:9px 0 17px;min-height:36px
}
.bottom{
  display:flex;align-items:center;justify-content:space-between;gap:10px
}
.price{font-size:13px;color:#aaa}
.view{
  background:#fff;color:#000;text-decoration:none;
  padding:9px 13px;border-radius:7px;
  font-size:11px;font-weight:900
}
.view:hover{background:#ddd}

footer{
  border-top:1px solid #181818;
  color:#555;text-align:center;padding:30px 20px;
  font-size:10px;letter-spacing:1px
}

@media(max-width:950px){
  .products{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:700px){
  .nav-links{display:none}
  .hero{padding-top:70px}
  .products{grid-template-columns:repeat(2,1fr);gap:12px}
  .image-box{height:230px}
}
@media(max-width:430px){
  .products{grid-template-columns:1fr}
  .image-box{height:300px}
}
</style>
</head>

<body>

<header>
  <nav class="nav">
    <div class="logo">LINKVISION <span>SHOP</span></div>

    <ul class="nav-links">
      <li><a href="#unisex">UNISEX</a></li>
      <li><a href="#men">HERREN / MEN</a></li>
      <li><a href="#women">DAMEN / WOMEN</a></li>
      <li><a href="#accessories">ACCESSORIES</a></li>
      <li><a href="#perfume">PARFUM / PERFUME</a></li>
    </ul>

    <div class="languages">
      <button id="enBtn" class="active" onclick="setLanguage('en')">EN</button>
      <button id="deBtn" onclick="setLanguage('de')">DE</button>
    </div>
  </nav>
</header>

<section class="hero">
  <small>LINKVISION SHOP</small>
  <h1>FIND YOUR<br>STYLE.</h1>
  <p id="heroText">
    Discover fashion, accessories and lifestyle products selected for you.
  </p>
</section>

<div class="filters">
  <button class="filter active" onclick="filterProducts('all',this)" data-en="ALL" data-de="ALLE">ALL</button>
  <button class="filter" onclick="filterProducts('unisex',this)" data-en="UNISEX" data-de="UNISEX">UNISEX</button>
  <button class="filter" onclick="filterProducts('men',this)" data-en="MEN" data-de="HERREN">MEN</button>
  <button class="filter" onclick="filterProducts('women',this)" data-en="WOMEN" data-de="DAMEN">WOMEN</button>
  <button class="filter" onclick="filterProducts('accessories',this)" data-en="ACCESSORIES" data-de="ACCESSOIRES">ACCESSORIES</button>
  <button class="filter" onclick="filterProducts('perfume',this)" data-en="PERFUME" data-de="PARFUM">PERFUME</button>
</div>

<main id="shop"></main>

<footer>
  © 2026 LINKVISION SHOP · Amazon PartnerNet
</footer>

<script>

const products=[

/* UNISEX */
{img:1,cat:"unisex",name:"Streetwear Hoodie",price:"€16.00",link:"https://amzn.to/3T3rEAT"},
{img:2,cat:"unisex",name:"Urban Beanie",price:"€20.00",link:"https://amzn.to/4rziwAV"},
{img:3,cat:"unisex",name:"Streetwear Essential",price:"€18.00",link:"https://amzn.to/3SSoJLk"},
{img:4,cat:"unisex",name:"Y2K Beanie",price:"€18.00",link:"https://amzn.to/4huuwjo"},
{img:5,cat:"unisex",name:"Urban Hoodie",price:"€29.00",link:"https://amzn.to/4cNLmao"},
{img:6,cat:"unisex",name:"Everyday Streetwear",price:"€36.00",link:"https://amzn.to/4gXHeHr"},
{img:7,cat:"unisex",name:"Printed Beanie",price:"€20.00",link:"https://amzn.to/4h83XiH"},

/* MEN */
{img:8,cat:"men",name:"Hooded Sweatshirt",price:"€38.00",link:"https://amzn.to/4AbvVCR"},
{img:9,cat:"men",name:"Cotton Street T-Shirt",price:"€33.00",link:"https://amzn.to/3TxfYGI"},
{img:10,cat:"men",name:"Premium Cotton T-Shirt",price:"€33.00",link:"https://amzn.to/3UMHHUf"},
{img:11,cat:"men",name:"Casual Street T-Shirt",price:"€33.00",link:"https://amzn.to/3VeuvaI"},
{img:12,cat:"men",name:"Modern Streetwear",price:"€29.00",link:"https://amzn.to/4rewRCz"},
{img:13,cat:"men",name:"Everyday Streetwear",price:"€25.00",link:"https://amzn.to/4h85wx5"},
{img:14,cat:"men",name:"Square Sunglasses",price:"€15.00",link:"https://amzn.to/4xU0USl"},

/* WOMEN */
{img:15,cat:"women",name:"Waist Chain Belt",price:"€14.00",link:"https://amzn.to/4cPdYQz"},
{img:16,cat:"women",name:"Stainless Steel Bracelet",price:"€18.00",link:"https://amzn.to/4gVHIxJ"},
{img:17,cat:"women",name:"Zip-Up Tracksuit",price:"€32.00",link:"https://amzn.to/4cPeRJ3"},
{img:18,cat:"women",name:"Cotton Sweatpants",price:"€22.00",link:"https://amzn.to/4Ai67oK"},
{img:19,cat:"women",name:"Urban Fashion Essential",price:"€25.00",link:"https://amzn.to/4gZ0eW4"},

/* ACCESSORIES */
{img:20,cat:"accessories",name:"Streetwear Cargo Shorts",price:"€24.00",link:"https://amzn.to/46XTTnM"},
{img:21,cat:"accessories",name:"Classic Multipack",price:"€45.00",link:"https://amzn.to/3ULUhDc"},
{img:22,cat:"accessories",name:"Minimal Wall Clock",price:"€30.00",link:"https://amzn.to/4xxThjr"},
{img:23,cat:"accessories",name:"Sneaker Wall Decor",price:"€20.00",link:"https://amzn.to/4j83XBS"},
{img:24,cat:"accessories",name:"Room Diffuser",price:"€25.00",link:"https://amzn.to/4j1wcSM"},
{img:25,cat:"accessories",name:"Music Wall Poster",price:"€15.00",link:"https://amzn.to/4iy61Tw"},

/* PERFUME */
{img:26,cat:"perfume",name:"Eau de Parfum",price:"€29.00",link:"https://amzn.to/4cNUGLq"},
{img:27,cat:"perfume",name:"Signature Fragrance",price:"€32.00",link:"https://amzn.to/4xxUCGZ"},
{img:28,cat:"perfume",name:"Modern Fragrance",price:"€35.00",link:"https://amzn.to/4gXLdUq"},
{img:29,cat:"perfume",name:"Everyday Eau de Parfum",price:"€28.00",link:"https://amzn.to/471rZHp"},
{img:30,cat:"perfume",name:"Premium Fragrance",price:"€45.00",link:"https://amzn.to/46sbDrk"},
{img:31,cat:"perfume",name:"Urban Signature Scent",price:"€39.00",link:"https://amzn.to/4AhDIz2"},
{img:32,cat:"perfume",name:"Classic Fragrance",price:"€30.00",link:"https://amzn.to/4riRz4j"},
{img:33,cat:"perfume",name:"Daily Signature Scent",price:"€27.00",link:"https://amzn.to/3T3DGu3"}

];

let language="en";
let currentFilter="all";

const labels={
  en:{
    unisex:"UNISEX",
    men:"MEN",
    women:"WOMEN",
    accessories:"ACCESSORIES",
    perfume:"PERFUME",
    view:"View →",
    hero:"Discover fashion, accessories and lifestyle products selected for you."
  },
  de:{
    unisex:"UNISEX",
    men:"HERREN",
    women:"DAMEN",
    accessories:"ACCESSOIRES",
    perfume:"PARFUM",
    view:"Ansehen →",
    hero:"Entdecke ausgewählte Fashion-, Accessoire- und Lifestyle-Produkte."
  }
};

function render(){

  const shop=document.getElementById("shop");
  shop.innerHTML="";

  const cats=["unisex","men","women","accessories","perfume"];

  cats.forEach(cat=>{

    if(currentFilter!=="all" && currentFilter!==cat)return;

    const list=products.filter(p=>p.cat===cat);
    if(!list.length)return;

    const section=document.createElement("section");
    section.id=cat;

    const title=document.createElement("h2");
    title.className="category-title";
    title.textContent=labels[language][cat];

    const grid=document.createElement("div");
    grid.className="products";

    list.forEach(p=>{

      const card=document.createElement("article");
      card.className="product";

      card.innerHTML=`
        <div class="image-box">
          <img
            class="product-image"
            src="images/product${p.img}.jpg"
            alt="${p.name}"
            onerror="this.style.display='none';this.nextElementSibling.style.display='block'"
          >
          <div class="image-fallback" style="display:none">
            LINKVISION
          </div>
        </div>

        <div class="info">
          <div class="tag">${labels[language][p.cat]}</div>
          <div class="name">${p.name}</div>

          <div class="bottom">
            <div class="price">${p.price}</div>
            <a
              class="view"
              href="${p.link}"
              target="_blank"
              rel="nofollow sponsored noopener"
            >${labels[language].view}</a>
          </div>
        </div>
      `;

      grid.appendChild(card);
    });

    section.appendChild(title);
    section.appendChild(grid);
    shop.appendChild(section);
  });
}

function filterProducts(category,button){

  currentFilter=category;

  document.querySelectorAll(".filter")
    .forEach(b=>b.classList.remove("active"));

  button.classList.add("active");

  render();

  if(category!=="all"){
    const section=document.getElementById(category);
    if(section){
      setTimeout(()=>{
        section.scrollIntoView({
          behavior:"smooth",
          block:"start"
        });
      },50);
    }
  }
}

function setLanguage(lang){

  language=lang;

  document.getElementById("enBtn")
    .classList.toggle("active",lang==="en");

  document.getElementById("deBtn")
    .classList.toggle("active",lang==="de");

  document.getElementById("heroText").textContent=
    labels[lang].hero;

  document.querySelectorAll(".filter").forEach(btn=>{
    btn.textContent=btn.dataset[lang];
  });

  render();
}

render();

</script>

</body>
</html>

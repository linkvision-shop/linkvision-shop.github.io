<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LINKVISION SHOP</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#050505;
  --card:#0b0b0b;
  --line:#1d1d1d;
  --muted:#777;
  --soft:#aaa;
  --white:#fff;
}

html{scroll-behavior:smooth}

body{
  background:var(--bg);
  color:var(--white);
  font-family:Inter,Arial,Helvetica,sans-serif;
  min-height:100vh;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% -10%,#171717 0,transparent 38%);
  z-index:-1;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(5,5,5,.82);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border-bottom:1px solid rgba(255,255,255,.07);
}

.nav{
  max-width:1300px;
  margin:auto;
  min-height:72px;
  padding:0 25px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:25px;
}

.logo{
  font-size:21px;
  font-weight:950;
  letter-spacing:2px;
  white-space:nowrap;
}

.logo span{
  color:#666;
  font-weight:700;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:24px;
  list-style:none;
}

.nav-links a{
  color:#888;
  text-decoration:none;
  font-size:10px;
  font-weight:900;
  letter-spacing:1.5px;
  transition:.2s;
}

.nav-links a:hover{
  color:#fff;
}

.languages{
  display:flex;
  align-items:center;
  gap:3px;
  padding:4px;
  border:1px solid #222;
  border-radius:9px;
  background:#0a0a0a;
}

.languages button{
  border:0;
  background:transparent;
  color:#666;
  cursor:pointer;
  font-size:10px;
  font-weight:900;
  padding:6px 8px;
  border-radius:6px;
}

.languages button.active{
  background:#fff;
  color:#000;
}

/* HERO */

.hero{
  max-width:1300px;
  margin:auto;
  padding:115px 25px 85px;
}

.hero small{
  color:#666;
  font-size:10px;
  font-weight:900;
  letter-spacing:5px;
}

.hero h1{
  margin:20px 0 25px;
  font-size:clamp(52px,9vw,105px);
  line-height:.86;
  font-weight:950;
  letter-spacing:-6px;
}

.hero p{
  max-width:530px;
  color:#777;
  font-size:14px;
  line-height:1.8;
}

/* FILTERS */

.filters{
  max-width:1300px;
  margin:auto;
  padding:0 25px 35px;
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.filter{
  background:#090909;
  border:1px solid #222;
  color:#777;
  padding:11px 17px;
  border-radius:8px;
  cursor:pointer;
  font-size:10px;
  font-weight:900;
  letter-spacing:1px;
  transition:.2s;
}

.filter:hover{
  border-color:#444;
  color:#fff;
}

.filter.active{
  background:#fff;
  border-color:#fff;
  color:#000;
}

/* SHOP */

main{
  max-width:1300px;
  margin:auto;
  padding:0 25px 100px;
}

.category-title{
  margin:55px 0 25px;
  display:flex;
  align-items:center;
  gap:18px;
  color:#fff;
  font-size:22px;
  font-weight:950;
  letter-spacing:3px;
  text-transform:uppercase;
}

.category-title:after{
  content:"";
  height:1px;
  background:#292929;
  flex:1;
}

/* PRODUCTS */

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}

.product{
  position:relative;
  overflow:hidden;
  background:linear-gradient(145deg,#0d0d0d,#080808);
  border:1px solid #181818;
  border-radius:15px;
  transition:
    transform .3s ease,
    border-color .3s ease,
    box-shadow .3s ease;
}

.product:hover{
  transform:translateY(-6px);
  border-color:#343434;
  box-shadow:0 15px 40px rgba(0,0,0,.4);
}

/* IMAGE */

.image-box{
  position:relative;
  height:315px;
  background:#101010;
  overflow:hidden;
}

.image-box:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to bottom,
    transparent 65%,
    rgba(0,0,0,.22)
  );
  pointer-events:none;
}

.product-image{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform .45s ease;
}

.product:hover .product-image{
  transform:scale(1.045);
}

.image-fallback{
  width:100%;
  height:100%;
  align-items:center;
  justify-content:center;
  color:#333;
  font-size:11px;
  font-weight:900;
  letter-spacing:3px;
}

/* INFO */

.info{
  padding:18px;
}

.tag{
  color:#666;
  font-size:8px;
  font-weight:900;
  letter-spacing:2px;
}

.name{
  margin:9px 0 18px;
  min-height:38px;
  color:#eee;
  font-size:14px;
  line-height:1.4;
  font-weight:850;
}

.bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.price{
  color:#aaa;
  font-size:12px;
  font-weight:800;
}

.view{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:76px;
  padding:10px 13px;
  background:#fff;
  color:#000;
  border-radius:7px;
  text-decoration:none;
  font-size:10px;
  font-weight:950;
  transition:.2s;
}

.view:hover{
  background:#ddd;
  transform:translateX(2px);
}

/* FOOTER */

footer{
  border-top:1px solid #181818;
  padding:35px 20px;
  text-align:center;
  color:#444;
  font-size:9px;
  letter-spacing:2px;
}

/* RESPONSIVE */

@media(max-width:1050px){
  .nav-links{gap:13px}
  .nav-links a{font-size:9px}
  .products{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:750px){
  .nav{
    min-height:65px;
    padding:0 17px;
  }

  .nav-links{
    display:none;
  }

  .hero{
    padding:80px 20px 60px;
  }

  .hero h1{
    letter-spacing:-4px;
  }

  .filters{
    padding:0 20px 25px;
  }

  main{
    padding:0 20px 70px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:12px;
  }

  .image-box{
    height:250px;
  }
}

@media(max-width:480px){
  .logo{
    font-size:17px;
  }

  .hero h1{
    font-size:53px;
  }

  .products{
    grid-template-columns:1fr;
  }

  .image-box{
    height:330px;
  }

  .category-title{
    font-size:18px;
  }
}
</style>
</head>

const labels={

en:{
unisex:"UNISEX",
men:"MEN",
women:"WOMEN",

perfume:"PERFUME",

},

unisex:"UNISEX",
men:"HERREN",
women:"DAMEN",
accessories:"ACCESSOIRES",
perfume:"PARFUM",
view:"Ansehen →",
hero:"Entdecke ausgewählte Fashion-, Accessoire- und Lifestyle-Produkte."
}

};

let language="en";
let currentFilter="all";

function render(){

const shop=document.getElementById("shop");

shop.innerHTML="";

const cats=[
"unisex",
"men",
"women",
"accessories",
"perfume"
];

cats.forEach(cat=>{

if(currentFilter!=="all" && currentFilter!==cat)return;

const list=products.filter(p=>p.cat===cat);

if(!list.length)return;

const section=document.createElement("section");

section.id=cat;

const title=document.createElement("h2");

title.className="category-title";

title.textContent=labels[language][cat];

const grid=document.createElement("div");

grid.className="products";

list.forEach(p=>{

const card=document.createElement("article");

card.className="product";

card.innerHTML=`

<div class="image-box">

<img
class="product-image"
src="images/product${p.img}.jpg"
alt="${p.name}"
onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"
>

<div class="image-fallback">
LINKVISION
</div>

</div>

<div class="info">

<div class="tag">
${labels[language][p.cat]}
</div>

<div class="name">
${p.name}
</div>

<div class="bottom">

<div class="price">
${p.price}
</div>

<a
class="view"
href="${p.link}"
target="_blank"
rel="nofollow sponsored noopener"
>
${labels[language].view}
</a>

</div>

</div>
`;

grid.appendChild(card);

});

section.appendChild(title);
section.appendChild(grid);

shop.appendChild(section);

});

}

function filterProducts(category,button){

currentFilter=category;

document
.querySelectorAll(".filter")
.forEach(b=>b.classList.remove("active"));

button.classList.add("active");

render();

}

function setLanguage(lang){

language=lang;

document
.getElementById("enBtn")
.classList.toggle("active",lang==="en");

document
.getElementById("deBtn")
.classList.toggle("active",lang==="de");

document
.getElementById("heroText")
.textContent=labels[lang].hero;

document
.querySelectorAll(".filter")
.forEach(btn=>{
btn.textContent=btn.dataset[lang];
});

render();

}

render();

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="description" content="LINKVISION SHOP — Fashion, accessories and lifestyle.">
<title>LINKVISION — SHOP</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#080912;
  --bg2:#0d1020;
  --card:#111425;
  --card2:#15192c;
  --white:#ffffff;
  --text:#f4f5fa;
  --muted:#8d92a8;
  --muted2:#666b80;
  --line:rgba(255,255,255,.09);
  --blue:#5b8cff;
  --purple:#8b5cf6;
  --pink:#d946ef;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  overflow-x:hidden;
  color:var(--text);
  font-family:Inter,Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 10% 0%,rgba(91,140,255,.13),transparent 28%),
    radial-gradient(circle at 90% 10%,rgba(139,92,246,.13),transparent 30%),
    linear-gradient(135deg,#070811,#0b0d18 50%,#080912);
}

/* BACKGROUND GLOW */

body:before{
  content:"";
  position:fixed;
  width:450px;
  height:450px;
  left:-250px;
  top:35%;
  border-radius:50%;
  background:rgba(91,140,255,.055);
  filter:blur(100px);
  pointer-events:none;
  z-index:-1;
}

body:after{
  content:"";
  position:fixed;
  width:450px;
  height:450px;
  right:-250px;
  bottom:5%;
  border-radius:50%;
  background:rgba(217,70,239,.045);
  filter:blur(110px);
  pointer-events:none;
  z-index:-1;
}

/* HEADER */

header{
  position:sticky;
  top:0;
  z-index:100;
  border-bottom:1px solid var(--line);
  background:rgba(7,8,17,.72);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
}

.nav{
  width:min(1320px,100%);
  min-height:76px;
  margin:auto;
  padding:0 25px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:25px;
}

.logo{
  white-space:nowrap;
  font-size:21px;
  font-weight:950;
  letter-spacing:2.5px;
}

.logo span{
  color:#85899b;
  font-weight:700;
}

/* NAVIGATION */

.nav-links{
  display:flex;
  align-items:center;
  gap:25px;
  list-style:none;
}

.nav-links a{
  position:relative;
  color:#9297aa;
  text-decoration:none;
  font-size:10px;
  font-weight:900;
  letter-spacing:1.5px;
  transition:.25s;
}

.nav-links a:hover{
  color:#fff;
}

.nav-links a:after{
  content:"";
  position:absolute;
  left:0;
  bottom:-8px;
  width:0;
  height:2px;
  border-radius:10px;
  background:linear-gradient(90deg,var(--blue),var(--purple));
  transition:.25s;
}

.nav-links a:hover:after{
  width:100%;
}

/* LANGUAGE */

.languages{
  display:flex;
  gap:3px;
  padding:4px;
  border:1px solid var(--line);
  border-radius:10px;
  background:rgba(255,255,255,.035);
}

.languages button{
  border:0;
  color:#6f7488;
  background:transparent;
  border-radius:7px;
  padding:7px 9px;
  cursor:pointer;
  font-size:10px;
  font-weight:900;
}

.languages button.active{
  color:#fff;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  box-shadow:0 5px 18px rgba(91,140,255,.2);
}

/* HERO */

.hero{
  position:relative;
  width:min(1320px,100%);
  margin:auto;
  padding:125px 25px 85px;
}

.hero small{
  display:inline-block;
  padding:9px 14px;
  border:1px solid rgba(139,92,246,.3);
  border-radius:30px;
  background:rgba(139,92,246,.07);
  color:#b9a9ff;
  font-size:9px;
  font-weight:900;
  letter-spacing:4px;
}

.hero h1{
  margin:25px 0 27px;
  font-size:clamp(55px,9vw,112px);
  line-height:.84;
  letter-spacing:-6px;
  font-weight:950;
  background:linear-gradient(
    110deg,
    #fff 10%,
    #e2e5ff 43%,
    #a993ff 72%,
    #72a0ff
  );
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.hero p{
  max-width:560px;
  color:#858a9f;
  font-size:14px;
  line-height:1.8;
}

/* FILTERS */

.filters{
  width:min(1320px,100%);
  margin:auto;
  padding:0 25px 42px;
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}

.filter{
  padding:11px 18px;
  border:1px solid var(--line);
  border-radius:30px;
  background:rgba(255,255,255,.035);
  color:#8e93a7;
  cursor:pointer;
  font-size:10px;
  font-weight:900;
  letter-spacing:1px;
  transition:.25s;
}

.filter:hover{
  color:#fff;
  border-color:rgba(139,92,246,.45);
  background:rgba(139,92,246,.08);
  transform:translateY(-2px);
}

.filter.active{
  color:#fff;
  border-color:transparent;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  box-shadow:0 8px 25px rgba(91,140,255,.2);
}

/* MAIN */

main{
  width:min(1320px,100%);
  margin:auto;
  padding:0 25px 100px;
}

/* CATEGORY */

.category-title{
  margin:58px 0 27px;
  display:flex;
  align-items:center;
  gap:18px;
  color:#fff;
  font-size:22px;
  font-weight:950;
  letter-spacing:3px;
}

.category-title:after{
  content:"";
  height:1px;
  flex:1;
  background:linear-gradient(
    90deg,
    rgba(139,92,246,.5),
    rgba(255,255,255,.08),
    transparent
  );
}

/* GRID */

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}

/* CARD */

.product{
  overflow:hidden;
  border:1px solid rgba(255,255,255,.075);
  border-radius:18px;
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.055),
      rgba(255,255,255,.018)
    );
  box-shadow:
    0 10px 35px rgba(0,0,0,.2),
    inset 0 1px rgba(255,255,255,.035);
  transition:.35s ease;
}

.product:hover{
  transform:translateY(-7px);
  border-color:rgba(139,92,246,.38);
  box-shadow:
    0 20px 50px rgba(0,0,0,.35),
    0 0 35px rgba(139,92,246,.08);
}

/* PHOTO AREA */

.image-box{
  position:relative;
  height:315px;
  padding:15px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(
      circle at 50% 45%,
      rgba(139,92,246,.1),
      transparent 58%
    ),
    #0d0f1b;
}

.image-box:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      135deg,
      rgba(91,140,255,.045),
      transparent 45%,
      rgba(217,70,239,.035)
    );
  pointer-events:none;
}

.product-image{
  position:relative;
  z-index:2;
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  transition:transform .45s ease;
}

.product:hover .product-image{
  transform:scale(1.045);
}

.image-fallback{
  position:absolute;
  inset:0;
  align-items:center;
  justify-content:center;
  color:#34384c;
  font-size:11px;
  font-weight:900;
  letter-spacing:4px;
}

/* INFO */

.info{
  padding:18px;
}

.tag{
  color:#8e94aa;
  font-size:8px;
  font-weight:900;
  letter-spacing:2px;
  text-transform:uppercase;
}

.name{
  min-height:40px;
  margin:9px 0 19px;
  color:#f1f2f7;
  font-size:14px;
  line-height:1.45;
  font-weight:850;
}

.bottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.price{
  color:#b9bdcc;
  font-size:12px;
  font-weight:800;
}

.view{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:82px;
  padding:10px 14px;
  border-radius:9px;
  color:#fff;
  text-decoration:none;
  font-size:10px;
  font-weight:950;
  background:linear-gradient(135deg,#5b8cff,#8b5cf6);
  box-shadow:0 7px 20px rgba(91,140,255,.18);
  transition:.25s;
}

.view:hover{
  transform:translateX(3px);
  box-shadow:0 9px 25px rgba(139,92,246,.3);
}

/* FOOTER */

footer{
  border-top:1px solid var(--line);
  padding:38px 20px;
  text-align:center;
  color:#505568;
  font-size:9px;
  letter-spacing:2px;
}

/* TABLET */

@media(max-width:1100px){

  .nav-links{
    gap:14px;
  }

  .nav-links a{
    font-size:9px;
  }

  .products{
    grid-template-columns:repeat(3,1fr);
  }
}

/* MOBILE */

@media(max-width:750px){

  .nav{
    min-height:68px;
    padding:0 18px;
  }

  .nav-links{
    display:none;
  }

  .hero{
    padding:85px 20px 65px;
  }

  .hero h1{
    letter-spacing:-4px;
  }

  .filters{
    padding:0 20px 30px;
  }

  main{
    padding:0 20px 75px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:13px;
  }

  .image-box{
    height:250px;
    padding:10px;
  }
}

/* SMALL MOBILE */

@media(max-width:480px){

  .logo{
    font-size:16px;
  }

  .hero h1{
    font-size:54px;
  }

  .products{
    grid-template-columns:1fr;
  }

  .image-box{
    height:330px;
    padding:15px;
  }

  .category-title{
    font-size:18px;
  }
}
</style>
</head>

const labels={

en:{
unisex:"UNISEX",
men:"MEN",
women:"WOMEN",
accessories:"ACCESSORIES",
perfume:"PERFUME",
view:"View →",
amazon:"Amazon",
hero:"Discover fashion, accessories and lifestyle products selected for you."
},

de:{
unisex:"UNISEX",
men:"HERREN",
women:"DAMEN",
accessories:"ACCESSOIRES",
perfume:"PARFUM",
view:"Ansehen →",
amazon:"Amazon",
hero:"Entdecke ausgewählte Fashion-, Accessoire- und Lifestyle-Produkte."
}

};

let language="en";
let currentFilter="all";

function render(){

const shop=document.getElementById("shop");

shop.innerHTML="";

const categories=[
"unisex",
"men",
"women",
"accessories",
"perfume"
];

categories.forEach(category=>{

if(
currentFilter!=="all" &&
currentFilter!==category
)return;

const list=products.filter(
product=>product.cat===category
);

if(!list.length)return;

const section=document.createElement("section");

section.id=category;

const title=document.createElement("h2");

title.className="category-title";
title.textContent=labels[language][category];

const grid=document.createElement("div");

grid.className="products";

list.forEach(product=>{

const card=document.createElement("article");

card.className="product";

card.innerHTML=`

<div class="image-box">

<img
class="product-image"
src="images/product${product.img}.jpg"
alt="${product.name}"
loading="lazy"
onerror="
this.style.display='none';
this.nextElementSibling.style.display='flex';
"
>

<div
class="image-fallback"
style="display:none"
>
LINKVISION
</div>

</div>

<div class="info">

<div class="tag">
${labels[language][product.cat]}
</div>

<div class="name">
${product.name}
</div>

<div class="bottom">

<div class="price">
${product.price}
</div>

<a
class="view"
href="${product.link}"
target="_blank"
rel="nofollow sponsored noopener"
>
${labels[language].view}
</a>

</div>

</div>
`;

grid.appendChild(card);

});

section.appendChild(title);
section.appendChild(grid);
shop.appendChild(section);

});

}

function filterProducts(category,button){

currentFilter=category;

document
.querySelectorAll(".filter")
.forEach(item=>{
item.classList.remove("active");
});

button.classList.add("active");

render();

}

function setLanguage(lang){

language=lang;

document
.getElementById("enBtn")
.classList.toggle("active",lang==="en");

document
.getElementById("deBtn")
.classList.toggle("active",lang==="de");

document
.getElementById("heroText")
.textContent=labels[lang].hero;

document
.querySelectorAll(".filter")
.forEach(button=>{
button.textContent=button.dataset[lang];
});

render();

}

render();
